<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AICheck Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>AICheck Pro</h1>
      <p>Détection avancée de textes générés par IA</p>
    </header>

    <section class="card">
      <h2>Analyser un texte</h2>
      <textarea id="textInput" placeholder="Collez votre texte ici..."></textarea>
      <button onclick="analyzeText()">Analyser</button>
    </section>

    <section id="results" class="card hidden">
      <h2>Résultat global</h2>

      <div class="score-box">
        <span id="prediction">---</span>
        <strong id="score">0%</strong>
      </div>

      <p><b>Langue :</b> <span id="language"></span></p>
      <p><b>Richesse lexicale :</b> <span id="lexical"></span></p>
      <p><b>Burstiness :</b> <span id="burstiness"></span></p>
      <p><b>Perplexity :</b> <span id="perplexity"></span></p>
      <p><b>Phrases suspectes :</b> <span id="suspicious"></span></p>
    </section>

    <section id="sentencesSection" class="card hidden">
      <h2>Analyse phrase par phrase</h2>
      <div id="sentences"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
